# Iliya & Pouriya — HOST nginx vhost (not the container one; see infra/nginx.conf)
#
# Install on the server as:
#   /etc/nginx/sites-available/iliya-pouriya
#   /etc/nginx/sites-enabled/iliya-pouriya  -> symlink to the above
#
# This server only runs this app, so the block is default_server and also
# answers a bare http://<ip>/. When the real domain arrives, replace
# `server_name _;` with that name, run `certbot --nginx`, and drop
# `default_server` if unknown hosts should stop landing here.
# Also rebuild the app image with the new NEXT_PUBLIC_SITE_URL — it is
# frozen at build time, see the Dockerfile.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Above the app's 100mb upload cap, for multipart overhead.
    client_max_body_size 110m;

    location / {
        # Container nginx (docker-compose.yml, nginx service).
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The container nginx reads this back via real_ip_header so its
        # rate-limit zones see the visitor, not the Docker bridge.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
