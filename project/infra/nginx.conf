# Iliya & Pouriya — nginx reverse proxy (container)
#
# Serves /uploads/* directly from the shared volume and proxies everything
# else to the web service.
#
# This sits behind the host nginx, which owns :80/:443 and terminates TLS.
# See infra/nginx-host.conf. App-specific rules live here so they ship
# with the code.

upstream iliya_web {
  server web:3000;
}

# Recover the real client IP from the host nginx's X-Forwarded-For.
#
# Without this every request arrives from the Docker bridge gateway, so the
# limit_req zones below would key on a single address and throttle all
# visitors together.
#
# Only private ranges are trusted, so a spoofed X-Forwarded-For from a
# client hitting :8080 directly is ignored.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Coarse second layer. The in-app limiter in lib/rate-limit.ts is the
# primary defense (contact form and admin login).
limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
  listen 80;
  server_name _;

  # Above the 100mb cap in next.config.ts, for multipart overhead.
  client_max_body_size 110m;

  # Uploaded media — served from the named volume, never executed.
  location /uploads/ {
    alias /app/uploads/;
    autoindex off;

    location ~* \.(php|php[3-8]?|phtml|pl|py|jsp|asp|aspx|sh|cgi)$ {
      deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "inline" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/admin/upload {
    limit_req zone=uploads burst=3 nodelay;
    proxy_pass http://iliya_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://iliya_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://iliya_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
