services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-iliya_pouriya}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Only exposed for local dev convenience (npm run db:migrate from the
      # host). Remove this mapping in production — the app container talks
      # to postgres over the compose network instead.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iliya_pouriya}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      UPLOADS_DIR: /app-data/uploads
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      CONTACT_NOTIFY_FROM: ${CONTACT_NOTIFY_FROM:-}
    volumes:
      - uploads_data:/app-data/uploads
    ports:
      - "127.0.0.1:3000:3000"

  # Reverse proxy: TLS termination + serving /uploads directly, per
  # docs/09_DEVELOPMENT_GUIDELINES.md. Point Caddy's site block at this
  # compose service, or run Caddy/Nginx separately on the VPS instead —
  # either is fine, this is just the simplest same-compose option.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/srv/uploads:ro

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
