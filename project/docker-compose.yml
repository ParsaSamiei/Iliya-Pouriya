name: iliya-pouriya

# Production stack. Host nginx owns :80 and :443 and terminates TLS.
# Nothing here binds those ports. Container nginx takes :8080 and the
# host vhost proxies to it — see infra/nginx-host.conf.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # No default on purpose — compose refuses to start rather than
      # bringing up the database with a guessable password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-iliya_pouriya}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only. The database must not answer on the public internet.
      # `docker compose exec postgres psql` does not need this mapping;
      # it exists so a dev machine can reach the data over an SSH tunnel.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-iliya_pouriya}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [iliya]

  # One-off job: applies pending migrations, then exits. `web` waits for
  # exit 0, so a failed migration blocks the new code from serving.
  migrator:
    image: iliya-pouriya-migrator:current
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-iliya_pouriya}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [iliya]

  web:
    image: iliya-pouriya-web:current
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-iliya_pouriya}
      UPLOADS_DIR: /app/uploads
      # Behind host nginx and container nginx. Auth.js rejects the
      # forwarded Host without this.
      AUTH_TRUST_HOST: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [iliya]
    healthcheck:
      # 127.0.0.1, not localhost. Alpine resolves localhost to ::1 first,
      # and the Next standalone server binds IPv4 only (HOSTNAME=0.0.0.0).
      # /robots.txt is a route handler that answers without a database query.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Published on all interfaces. Host nginx proxies :80 here, and
      # http://<ip>:8080 hits this container directly — useful for telling
      # an app problem from a host-proxy problem.
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/app/uploads:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [iliya]

networks:
  iliya:

volumes:
  postgres_data:
  # Named volume, not a bind mount into the container's writable layer,
  # or uploads disappear on every rebuild.
  uploads:
